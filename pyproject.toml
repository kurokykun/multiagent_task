[project]
name = "pedidos-multiagente"
version = "1.0.0"
description = "Sistema multiagente (LangGraph + FastAPI) sobre datos de pedidos en DuckDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlglot>=25",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
